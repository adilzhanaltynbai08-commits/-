<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уақыт — сағат дүкені</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#e8edef; --ink:#12202b; --mute:#5d6b76; --card:#f6f8f9; --brass:#b0802f; --line:#cfd7dc; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Manrope", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  header { display:flex; justify-content:space-between; align-items:center; padding:18px clamp(16px,5vw,56px); position:sticky; top:0; background:rgba(232,237,239,.9); backdrop-filter:blur(8px); z-index:5; border-bottom:1px solid var(--line); }
  .logo { font: 700 1.6rem "Playfair Display", serif; letter-spacing:.01em; }
  .cart-btn { display:flex; gap:10px; align-items:center; background:var(--ink); color:#fff; border:0; padding:10px 18px; border-radius:999px; font-weight:600; }
  .cart-btn b { background:var(--brass); border-radius:999px; min-width:24px; height:24px; display:grid; place-items:center; font-size:.8rem; }

  .hero { padding: clamp(40px,8vw,90px) clamp(16px,5vw,56px) 30px; max-width:900px; }
  .hero h1 { font: 700 clamp(2.2rem,6vw,4.2rem)/1.08 "Playfair Display", serif; }
  .hero p { margin-top:16px; color:var(--mute); font-size:1.1rem; max-width:52ch; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:22px; padding:20px clamp(16px,5vw,56px) 70px; }
  .card { background:var(--card); border-radius:18px; padding:18px; display:flex; flex-direction:column; border:1px solid var(--line); }
  .card svg { width:100%; height:230px; }
  .card h3 { font:700 1.2rem "Playfair Display", serif; margin-top:8px; }
  .card .desc { color:var(--mute); font-size:.92rem; margin:4px 0 14px; flex:1; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .price { font-weight:700; font-size:1.1rem; }
  .add { background:var(--brass); color:#fff; border:0; padding:10px 16px; border-radius:10px; font-weight:700; }
  .add:hover { filter:brightness(1.08); }

  .overlay { position:fixed; inset:0; background:rgba(18,32,43,.45); opacity:0; pointer-events:none; transition:opacity .25s; z-index:10; }
  .overlay.open { opacity:1; pointer-events:auto; }
  aside { position:fixed; top:0; right:0; height:100%; width:min(420px,100%); background:var(--card); z-index:11; transform:translateX(100%); transition:transform .3s; display:flex; flex-direction:column; }
  aside.open { transform:none; }
  aside header { position:static; background:none; backdrop-filter:none; }
  aside h2 { font:700 1.4rem "Playfair Display", serif; }
  .close { background:none; border:0; font-size:1.6rem; color:var(--ink); }
  #items { flex:1; overflow:auto; padding:8px 20px; }
  .empty { color:var(--mute); text-align:center; margin-top:60px; }
  .item { display:grid; grid-template-columns:64px 1fr auto; gap:12px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
  .item svg { width:64px; height:64px; }
  .item h4 { font-size:.98rem; }
  .item small { color:var(--mute); }
  .qty { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .qty button { width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:#fff; }
  .rm { background:none; border:0; color:var(--mute); text-decoration:underline; font-size:.85rem; }
  .total { padding:20px; border-top:1px solid var(--line); }
  .total .row { font-size:1.2rem; font-weight:700; margin-bottom:14px; }
  .buy { width:100%; background:var(--ink); color:#fff; border:0; padding:14px; border-radius:12px; font-weight:700; }
  .buy:disabled { opacity:.4; cursor:not-allowed; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,80px); background:var(--ink); color:#fff; padding:12px 20px; border-radius:12px; transition:transform .3s; z-index:20; }
  .toast.show { transform:translate(-50%,0); }
  footer { text-align:center; color:var(--mute); padding:30px; font-size:.9rem; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header>
  <div class="logo">Уақыт</div>
  <button class="cart-btn" id="openCart" aria-label="Себетті ашу">Себет <b id="count">0</b></button>
</header>

<section class="hero">
  <h1>Әр сәт қымбат. Сағатыңызды таңдаңыз.</h1>
  <p>Күнделікті өмірге де, ерекше күнге де лайық алты үлгі. Қазақстан бойынша жеткізу тегін.</p>
</section>

<section class="grid" id="grid" aria-label="Сағаттар"></section>

<div class="overlay" id="overlay"></div>
<aside id="cart" aria-label="Себет">
  <header><h2>Себет</h2><button class="close" id="closeCart" aria-label="Жабу">×</button></header>
  <div id="items"></div>
  <div class="total">
    <div class="row"><span>Жиыны</span><span id="sum">0 ₸</span></div>
    <button class="buy" id="buy">Тапсырыс беру</button>
  </div>
</aside>
<div class="toast" id="toast"></div>
<footer>© 2026 Уақыт. Барлық құқықтар қорғалған.</footer>

<script>
  const products = [
    { id:1, name:"Алтай Классик",  price:89000,  desc:"Ақ циферблат, күміс корпус, былғары белбеу.", dial:"#f7f4ee", ring:"#c9ced3", hand:"#1c2530", strap:"#6b4a32" },
    { id:2, name:"Түнгі Аспан",    price:124000, desc:"Қою көк циферблат, алтын түсті корпус.",       dial:"#16264a", ring:"#c9a24a", hand:"#f1e3b5", strap:"#1b2438" },
    { id:3, name:"Дала Хронограф", price:156000, desc:"Жасыл циферблат, су өткізбейді (100 м).",      dial:"#2f5a45", ring:"#aab3ae", hand:"#f2f2e8", strap:"#3b3a34" },
    { id:4, name:"Жібек Жолы",     price:98000,  desc:"Раушан түсті циферблат, жұқа корпус.",         dial:"#f1d9d2", ring:"#d9b38c", hand:"#5a3a33", strap:"#a8786a" },
    { id:5, name:"Тау Спорт",      price:72000,  desc:"Қара циферблат, жеңіл және беріктігі жоғары.", dial:"#1a1d21", ring:"#e2762f", hand:"#ffffff", strap:"#2a2d32" },
    { id:6, name:"Ай Минимал",     price:64000,  desc:"Сұр циферблат, тек керегінше ғана.",           dial:"#dde1e4", ring:"#8d969d", hand:"#222a31", strap:"#9aa3a9" }
  ];
  const fmt = n => n.toLocaleString("ru-RU").replace(/\u00a0/g," ") + " ₸";
  const $ = id => document.getElementById(id);

  function watchSVG(p) {
    let ticks = "";
    for (let i = 0; i < 12; i++) {
      const a = i * 30 * Math.PI / 180, r1 = i % 3 ? 34 : 30, r2 = 38;
      ticks += `<line x1="${50 + Math.sin(a)*r1}" y1="${50 - Math.cos(a)*r1}" x2="${50 + Math.sin(a)*r2}" y2="${50 - Math.cos(a)*r2}" stroke="${p.hand}" stroke-width="${i % 3 ? 1 : 2}" stroke-linecap="round" opacity=".8"/>`;
    }
    return `<svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="38" y="0" width="24" height="100" rx="6" fill="${p.strap}"/>
      <circle cx="50" cy="50" r="44" fill="${p.ring}"/>
      <circle cx="50" cy="50" r="41" fill="${p.dial}"/>
      ${ticks}
      <line x1="50" y1="50" x2="42" y2="34" stroke="${p.hand}" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="66" y2="24" stroke="${p.hand}" stroke-width="2" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="2.6" fill="${p.ring}"/>
    </svg>`;
  }

  // Себет күйі
  let cart = {};
  try { cart = JSON.parse(localStorage.getItem("saghat-cart")) || {}; } catch (e) { cart = {}; }
  const save = () => { try { localStorage.setItem("saghat-cart", JSON.stringify(cart)); } catch (e) {} };

  $("grid").innerHTML = products.map(p => `
    <article class="card">
      ${watchSVG(p)}
      <h3>${p.name}</h3>
      <p class="desc">${p.desc}</p>
      <div class="row"><span class="price">${fmt(p.price)}</span>
      <button class="add" data-id="${p.id}">Себетке салу</button></div>
    </article>`).join("");

  function render() {
    const ids = Object.keys(cart).filter(id => cart[id] > 0);
    let total = 0, count = 0;
    $("items").innerHTML = ids.length ? ids.map(id => {
      const p = products.find(x => x.id == id), q = cart[id];
      total += p.price * q; count += q;
      return `<div class="item">${watchSVG(p)}
        <div><h4>${p.name}</h4><small>${fmt(p.price)}</small>
          <div class="qty"><button data-act="dec" data-id="${id}" aria-label="Азайту">−</button>
          <span>${q}</span><button data-act="inc" data-id="${id}" aria-label="Көбейту">+</button></div></div>
        <button class="rm" data-act="rm" data-id="${id}">Жою</button></div>`;
    }).join("") : `<p class="empty">Себет бос. Сағат таңдаңыз.</p>`;
    $("count").textContent = count;
    $("sum").textContent = fmt(total);
    $("buy").disabled = !ids.length;
    save();
  }

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
  }
  const openCart = o => { $("cart").classList.toggle("open", o); $("overlay").classList.toggle("open", o); };

  $("grid").addEventListener("click", e => {
    const b = e.target.closest(".add"); if (!b) return;
    cart[b.dataset.id] = (cart[b.dataset.id] || 0) + 1; render();
    toast(products.find(p => p.id == b.dataset.id).name + " себетке қосылды");
  });
  $("items").addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id;
    if (b.dataset.act === "inc") cart[id]++;
    if (b.dataset.act === "dec") cart[id] = Math.max(0, cart[id] - 1);
    if (b.dataset.act === "rm") cart[id] = 0;
    render();
  });
  $("openCart").onclick = () => openCart(true);
  $("closeCart").onclick = $("overlay").onclick = () => openCart(false);
  document.addEventListener("keydown", e => { if (e.key === "Escape") openCart(false); });
  $("buy").onclick = () => { cart = {}; render(); openCart(false); toast("Рахмет! Тапсырысыңыз қабылданды."); };

  render();
</script>
</body>
</html>
